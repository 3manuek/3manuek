<div class="sidebar-about">
    <div class="brand">
        {{ if .Site.Params.remote_brand_image }}
            <a href="{{ .Site.Home.RelPermalink }}" class="brand-image-wrapper">
                <img src="{{ .Site.Params.remote_brand_image }}" alt="Emanuel Calvo">
            </a>
        {{ else if .Site.Params.brand_image }}
            <a href="{{ .Site.Home.RelPermalink }}" class="brand-image-wrapper">
                <img src="{{ .Site.Params.brand_image }}" alt="Emanuel Calvo">
            </a>
        {{ end }}
        {{ if .Site.Params.brand }}
            <a href="{{ .Site.Home.RelPermalink }}">
                <p class="sidebar-brand-name">{{ .Site.Params.brand }}</p>
            </a>
        {{ end }}
    </div>
    <p class="lead">
    {{ with .Site.Params.sidebar_description }}{{. | safeHTML}}{{end}}
    </p>

</div>
